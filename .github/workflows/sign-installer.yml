name: Sign Setup with SignPath

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Inno Setup
        run: choco install innosetup --yes

      - name: Build Installer
        run: iscc "DBDReshadeLauncherInstaller.iss"

      - name: Upload and sign with SignPath
        uses: SignPath/github-action@v0
        with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: e75d0231-1601-46d4-a447-a8853be541b3
        project-slug: DBDReshadeLauncher
        signing-policy-slug: Joolace
        artifact-path: path/to/output/DBDReshadeLauncherSetup.exe
