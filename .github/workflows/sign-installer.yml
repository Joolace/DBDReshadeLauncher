name: Build and Sign Installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Inno Setup
      run: |
        choco install innosetup --yes
        echo "Installed Inno Setup"

    - name: Build installer
      run: |
        iscc path/to/your_script.iss

    - name: Upload unsigned installer to SignPath
      uses: SignPath/github-action-signpath@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: YOUR-ORG-ID
        project-slug: YOUR-PROJECT-SLUG
        signing-policy-slug: open-source
        artifact-path: path/to/output/DBDReshadeLauncherSetup.exe
